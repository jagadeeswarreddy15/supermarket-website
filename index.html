<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jaga Supermarket</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7f4;color:#222}
header{position:sticky;top:0;z-index:5;background:#168b4b;color:#fff;padding:14px 5%;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:20px;font-weight:bold}button{cursor:pointer}
#cartBtn{border:0;border-radius:22px;padding:9px 14px;background:#fff;color:#168b4b;font-weight:bold}
#cartCount{background:#ffd21c;color:#222;border-radius:50%;padding:2px 6px}
.hero{max-width:1100px;margin:18px auto;padding:35px;min-height:220px;border-radius:18px;background:linear-gradient(120deg,#168b4b,#7bcf45);color:#fff}
.hero h1{font-size:38px;margin:0 0 10px}.hero p{font-size:18px}.hero a{display:inline-block;background:#ffd21c;color:#222;text-decoration:none;padding:11px 18px;border-radius:22px;font-weight:bold}
main{max-width:1100px;margin:auto;padding:10px 5% 40px}h2{text-align:center}
#search{width:100%;padding:13px;border:1px solid #ccc;border-radius:10px;font-size:16px}
.categories{display:flex;gap:8px;overflow:auto;padding:14px 0}.categories button{white-space:nowrap;border:1px solid #168b4b;background:#fff;color:#168b4b;border-radius:18px;padding:8px 14px}
.categories button.active{background:#168b4b;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}
.card{background:#fff;border-radius:14px;padding:12px;box-shadow:0 2px 10px #0001}.pic{height:125px;border-radius:10px;background:#fafafa;display:flex;align-items:center;justify-content:center;font-size:75px}
.card h3{margin:9px 0 4px}.price{font-weight:bold;color:#168b4b}.card button{width:100%;border:0;background:#168b4b;color:#fff;padding:9px;border-radius:8px;margin-top:8px}
.cart{margin-top:35px;background:#fff;padding:18px;border-radius:14px}.cart-row{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ddd;padding:10px 0}
.qty button{padding:3px 8px;margin:0 3px}.total{text-align:right;font-size:20px;font-weight:bold;margin:15px 0}
.checkout{width:100%;padding:12px;border:0;border-radius:10px;background:#168b4b;color:#fff;font-weight:bold}
footer{text-align:center;background:#123d2a;color:#fff;padding:18px}
</style>
</head>
<body>
<header><div class="logo">🛒 Jaga Supermarket</div><button id="cartBtn">🛒 Cart <b id="cartCount">0</b></button></header>
<section class="hero"><h1>Fresh Products<br>Better Life</h1><p>Quality groceries at great prices.</p><a href="#products">Shop Now</a></section>
<main>
<h2 id="products">Products</h2>
<input id="search" type="search" placeholder="Search products...">
<div class="categories">
<button class="active" data-cat="All">All</button><button data-cat="Fruits">Fruits</button><button data-cat="Vegetables">Vegetables</button><button data-cat="Dairy">Dairy</button><button data-cat="Snacks">Snacks</button><button data-cat="Drinks">Drinks</button>
</div>
<div id="grid" class="grid"></div>
<section id="cart" class="cart"><h2>Your Cart</h2><div id="items"></div><div class="total">Total: ₹<span id="total">0</span></div><button class="checkout" onclick="checkout()">Checkout</button></section>
</main>
<footer>© 2026 Jaga Supermarket • Fresh • Affordable • Fast</footer>
<script>
const products=[
{name:"Apple",price:120,cat:"Fruits",emoji:"🍎"},
{name:"Milk (1 L)",price:60,cat:"Dairy",emoji:"🥛"},
{name:"Bread",price:40,cat:"Snacks",emoji:"🍞"},
{name:"Vegetables",price:80,cat:"Vegetables",emoji:"🥦"},
{name:"Chips",price:50,cat:"Snacks",emoji:"🍟"},
{name:"Cold Drink",price:50,cat:"Drinks",emoji:"🥤"}
];
let cart=JSON.parse(localStorage.getItem("jagaCart")||"[]"),cat="All";
const grid=document.getElementById("grid"),search=document.getElementById("search");
function render(){
 let q=search.value.toLowerCase();
 let list=products.filter(p=>(cat==="All"||p.cat===cat)&&p.name.toLowerCase().includes(q));
 grid.innerHTML=list.map((p,i)=>`<div class="card"><div class="pic">${p.emoji}</div><h3>${p.name}</h3><div class="price">₹${p.price}</div><button onclick="add(${products.indexOf(p)})">Add to Cart</button></div>`).join("");
}
function add(i){let x=cart.find(p=>p.name===products[i].name);x?x.qty++:cart.push({...products[i],qty:1});save();show();}
function save(){localStorage.setItem("jagaCart",JSON.stringify(cart))}
function show(){
 document.getElementById("cartCount").textContent=cart.reduce((s,p)=>s+p.qty,0);
 document.getElementById("items").innerHTML=cart.length?cart.map((p,i)=>`<div class="cart-row"><span>${p.emoji} ${p.name}<br>₹${p.price}</span><span class="qty"><button onclick="change(${i},-1)">−</button>${p.qty}<button onclick="change(${i},1)">+</button><button onclick="removeItem(${i})">✕</button></span></div>`).join(""):"<p>Your cart is empty.</p>";
 document.getElementById("total").textContent=cart.reduce((s,p)=>s+p.price*p.qty,0);
}
function change(i,n){cart[i].qty+=n;if(cart[i].qty<=0)cart.splice(i,1);save();show()}
function removeItem(i){cart.splice(i,1);save();show()}
function checkout(){alert(cart.length?"Checkout demo — your cart is ready!":"Your cart is empty.")}
document.querySelectorAll(".categories button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".categories button").forEach(x=>x.classList.remove("active"));b.classList.add("active");cat=b.dataset.cat;render()});
search.oninput=render;
document.getElementById("cartBtn").onclick=()=>document.getElementById("cart").scrollIntoView({behavior:"smooth"});
render();show();
</script>
</body>
</html>
